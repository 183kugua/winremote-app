<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WinRemote 控制台</title>
<meta name="theme-color" content="#0b0d0f">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<style>
  :root{
    --bg:#0b0d0f;
    --panel:#121517;
    --panel2:#171b1f;
    --line:#21262b;
    --line2:#2c3339;
    --text:#e9ecef;
    --dim:#8b939b;
    --dim2:#5f6870;
    --accent:#3ba7c4;
    --accent-soft:rgba(59,167,196,.10);
    --ok:#4cb782;
    --warn:#d3a45f;
    --danger:#d2605a;
    --r:12px;
    --rs:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;
  }
  .app{height:100vh;display:grid;grid-template-columns:210px 1fr}

  /* ────────── 侧栏 ────────── */
  .rail{
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 12px 14px;
  }
  .brand{display:flex;gap:10px;align-items:center;padding:2px 6px 22px}
  .mark{
    width:28px;height:28px;border-radius:8px;flex:0 0 auto;position:relative;overflow:hidden;
    background:linear-gradient(155deg,#4fb4cf,#2b7f99);
  }
  .mark:after{
    content:"";position:absolute;left:-4px;right:-4px;bottom:-10px;height:22px;
    border-radius:50%;background:rgba(255,255,255,.20);
  }
  .brand-text{font-size:14.5px;font-weight:600;letter-spacing:.1px;line-height:1.25}
  .brand-text em{
    display:block;font-style:normal;font-weight:400;font-size:12px;
    color:var(--dim2);margin-top:2px;letter-spacing:0;
  }
  nav{display:flex;flex-direction:column;gap:2px}
  nav button{
    all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--rs);
    font-size:14px;color:var(--dim);transition:background .13s,color .13s;
    display:flex;align-items:center;gap:9px;position:relative;
  }
  nav button:hover{background:var(--panel2);color:var(--text)}
  nav button.on{background:var(--panel2);color:var(--text);font-weight:500}
  nav button.on:before{
    content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
    width:3px;height:16px;background:var(--accent);border-radius:0 2px 2px 0;
  }
  .rail-foot{
    margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim2);
  }
  .rail-foot b{font-weight:500;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 状态圆点 */
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--dim2)}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(76,183,130,.13)}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(210,96,90,.13)}

  /* ────────── 主区 ────────── */
  main{overflow-y:auto;padding:30px 34px 40px}
  main::-webkit-scrollbar{width:9px}
  main::-webkit-scrollbar-thumb{background:#232a2f;border-radius:5px;border:2px solid var(--bg)}
  main::-webkit-scrollbar-thumb:hover{background:#2f383e}
  main::-webkit-scrollbar-track{background:transparent}

  .page{display:none}
  .page.on{display:block;animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .ph{margin-bottom:22px}
  .ph h1{font-size:21px;font-weight:600;letter-spacing:-.2px}
  .ph p{color:var(--dim2);font-size:13px;margin-top:5px;word-break:break-all}

  /* 状态卡 */
  .status{
    border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
    padding:22px 24px;display:flex;align-items:center;gap:18px;
  }
  .pulse{width:10px;height:10px;border-radius:50%;background:var(--dim2);flex:0 0 auto;position:relative}
  .pulse.ok{background:var(--ok)}
  .pulse.ok:after{
    content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1px solid rgba(76,183,130,.35);animation:pl 2.4s ease-out infinite;
  }
  @keyframes pl{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.2);opacity:0}}
  .st-main{min-width:0}
  .st-t{font-size:25px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
  .st-s{color:var(--dim2);font-size:13.5px;margin-top:6px;font-variant-numeric:tabular-nums}

  .pill{
    margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto;
    padding:7px 14px;border-radius:999px;font-size:13px;color:var(--dim);
    border:1px solid var(--line);background:#0f1214;
  }
  .pill i{width:6px;height:6px;border-radius:50%;background:var(--dim2);display:block}
  .pill.ok{color:#8fd9b4;border-color:rgba(76,183,130,.32);background:rgba(76,183,130,.07)}
  .pill.ok i{background:var(--ok)}
  .pill.bad{color:#ea9c97;border-color:rgba(210,96,90,.32);background:rgba(210,96,90,.07)}
  .pill.bad i{background:var(--danger)}

  /* 按钮 */
  .row{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  button.btn{
    all:unset;cursor:pointer;height:38px;padding:0 20px;border-radius:var(--rs);
    border:1px solid var(--line);color:var(--text);font-size:14px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .13s,border-color .13s,color .13s;
  }
  button.btn:hover{background:var(--panel2);border-color:var(--line2)}
  button.btn:active{transform:translateY(.5px)}
  button.btn.primary{
    background:var(--accent);border-color:var(--accent);color:#04161c;font-weight:600;
  }
  button.btn.primary:hover{filter:brightness(1.09);background:var(--accent)}
  button.btn.danger{color:#e08a86;border-color:rgba(210,96,90,.30)}
  button.btn.danger:hover{background:rgba(210,96,90,.11);border-color:rgba(210,96,90,.5);color:#efa5a1}
  button.btn.sm{height:32px;padding:0 15px;font-size:13px;border-radius:8px}
  button.btn.ghost{color:var(--dim2)}
  button.btn.ghost:hover{color:var(--dim);border-color:var(--line2);background:transparent}
  button.btn[disabled]{opacity:.32;pointer-events:none}
  button.btn.confirm{
    background:rgba(210,96,90,.14);border-color:rgba(210,96,90,.55);color:#efa5a1;font-weight:600;
  }

  /* 卡片 */
  .card{
    margin-top:18px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--panel);padding:4px 20px 8px;
  }
  .card>h2{
    font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
    color:var(--dim2);padding:16px 0 4px;
  }
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
  .kv>div{padding:10px 0;min-width:0}
  .kv k{display:block;font-size:12px;color:var(--dim2);margin-bottom:4px;font-weight:400}
  .kv v{font-size:13.5px;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;
        font-variant-numeric:tabular-nums}

  .lines{
    padding:8px 0 12px;font:12.5px/2.0 ui-monospace,Consolas,"SF Mono",monospace;color:#8f979f;
  }
  .lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lines .e{color:#e0847f} .lines .w{color:var(--warn)} .lines .i{color:#6fa9be}
  .lines .ph-line{color:var(--dim2)}

  .errline{
    margin-top:16px;border:1px solid rgba(210,96,90,.30);background:rgba(210,96,90,.06);
    border-radius:var(--rs);padding:10px 14px;font:13px/1.65 ui-monospace,Consolas,monospace;
    color:#e0847f;display:none;max-height:3.4em;overflow:hidden;word-break:break-all;
  }
  .errline.stale{border-color:var(--line2);background:rgba(255,255,255,.025);color:var(--dim)}

  /* 设置表单 */
  .field{
    display:grid;grid-template-columns:168px 1fr;gap:16px;align-items:center;
    padding:12px 0;border-bottom:1px solid #1a1e21;
  }
  .field:last-child{border-bottom:0}
  .field>label{font-size:14px}
  .field>label small{display:block;color:var(--dim2);font-size:12px;margin-top:2px}
  input[type=text],input[type=password],input[type=number]{
    width:100%;height:36px;background:#0a0c0e;border:1px solid var(--line);
    border-radius:8px;padding:0 12px;color:var(--text);font:inherit;font-size:13.5px;
    outline:none;transition:border-color .13s,background .13s;
    -webkit-user-select:text;user-select:text;
  }
  input:focus{border-color:rgba(59,167,196,.65);background:#0c1013}
  input::placeholder{color:#454d54}
  .inline{display:flex;align-items:center;gap:11px}
  .hint{color:var(--dim2);font-size:12.5px;line-height:1.55}
  .pwd{position:relative}
  .pwd input{padding-right:52px}
  .pwd button{
    all:unset;cursor:pointer;position:absolute;right:6px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--dim2);padding:4px 8px;border-radius:6px;
  }
  .pwd button:hover{color:var(--text);background:var(--panel2)}

  /* 开关 */
  .sw{
    width:38px;height:22px;border-radius:22px;background:#262c31;position:relative;
    cursor:pointer;flex:0 0 auto;transition:background .17s;
  }
  .sw:after{
    content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#79838c;transition:left .17s,background .17s;box-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  .sw.on{background:rgba(59,167,196,.34)}
  .sw.on:after{left:18px;background:var(--accent)}
  .sw.danger.on{background:rgba(210,96,90,.32)}
  .sw.danger.on:after{background:var(--danger)}

  /* 权限 */
  .perms{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:6px 0 12px}
  .perm{
    display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;
    border:1px solid var(--line);background:#0f1214;font-size:13px;color:var(--dim);
    cursor:pointer;transition:border-color .13s,background .13s,color .13s;
  }
  .perm:hover{border-color:var(--line2);color:var(--text)}
  .perm.on{color:var(--text);border-color:rgba(59,167,196,.42);background:var(--accent-soft)}
  .tick{
    width:14px;height:14px;border-radius:4.5px;border:1px solid #343c43;flex:0 0 auto;
    position:relative;transition:background .13s,border-color .13s;
  }
  .perm.on .tick{background:var(--accent);border-color:var(--accent)}
  .perm.on .tick:after{
    content:"";position:absolute;left:3.6px;top:1px;width:4.5px;height:8px;
    border:solid #04161c;border-width:0 1.7px 1.7px 0;transform:rotate(42deg);
  }

  /* 日志页 */
  .logbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .logbar .sp{margin-left:auto}
  .log{
    background:#08090a;border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;height:calc(100vh - 218px);overflow-y:auto;
    font:13px/1.8 ui-monospace,Consolas,"SF Mono",monospace;color:#98a1a9;
    -webkit-user-select:text;user-select:text;
  }
  .log::-webkit-scrollbar{width:9px}
  .log::-webkit-scrollbar-thumb{background:#232a2f;border-radius:5px;border:2px solid #08090a}
  .log::-webkit-scrollbar-thumb:hover{background:#2f383e}
  .log::-webkit-scrollbar-track{background:transparent}
  .log .e{color:#e0847f} .log .w{color:var(--warn)} .log .i{color:#6fa9be}
  .log .ph-line{color:var(--dim2)}
  button.tgl{
    all:unset;cursor:pointer;height:32px;padding:0 14px;border-radius:8px;font-size:13px;
    border:1px solid var(--line);color:var(--dim2);display:inline-flex;align-items:center;gap:7px;
    transition:color .13s,border-color .13s,background .13s;
  }
  button.tgl:before{
    content:"";width:6px;height:6px;border-radius:50%;background:#39424a;transition:background .13s;
  }
  button.tgl.on{color:#8fd9b4;border-color:rgba(76,183,130,.3);background:rgba(76,183,130,.06)}
  button.tgl.on:before{background:var(--ok)}
  button.tgl:hover{border-color:var(--line2)}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
    background:#191d21;border:1px solid var(--line2);border-radius:10px;
    padding:11px 20px;font-size:13.5px;opacity:0;transition:opacity .2s,transform .2s;
    pointer-events:none;max-width:70vw;box-shadow:0 8px 28px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{border-color:rgba(210,96,90,.5);color:#e0847f}
  .toast.good{border-color:rgba(76,183,130,.42);color:#8fd9b4}

  @media(max-width:820px){
    .app{grid-template-columns:60px 1fr}
    .brand-text,nav button span,.rail-foot b{display:none}
    nav button{justify-content:center;padding:10px 0}
    nav button.on:before{left:-12px}
    .kv{grid-template-columns:1fr}
    .perms{grid-template-columns:1fr 1fr}
    .field{grid-template-columns:1fr;gap:8px}
    main{padding:22px}
    .pill{margin-left:0}
    .status{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark"></div>
      <div class="brand-text">WinRemote<em id="ver">C 端执行器</em></div>
    </div>
    <nav id="nav">
      <button data-p="ov" class="on"><span>概览</span></button>
      <button data-p="set"><span>设置</span></button>
      <button data-p="log"><span>日志</span></button>
    </nav>
    <div class="rail-foot">
      <span class="dot" id="footdot"></span><b id="footdev">未连接</b>
    </div>
  </aside>

  <main>
    <!-- ═══ 概览 ═══ -->
    <section class="page on" id="p-ov">
      <div class="ph">
        <h1>服务状态</h1>
        <p>本机执行器进程与 B 端连接情况</p>
      </div>

      <div class="status">
        <span class="pulse" id="pulse"></span>
        <div class="st-main">
          <div class="st-t" id="stateTitle">检测中…</div>
          <div class="st-s" id="stateSub">正在读取进程状态</div>
        </div>
        <div class="pill" id="connPill"><i></i><span id="conntext">连接状态未知</span></div>
      </div>

      <div class="row">
        <button class="btn primary" id="btnStart">开启进程</button>
        <button class="btn" id="btnRestart">重启</button>
        <button class="btn danger" id="btnStop">关闭</button>
      </div>

      <div class="errline" id="errline"></div>

      <section class="card">
        <h2>运行信息</h2>
        <div class="kv">
          <div><k>设备 ID</k><v id="iDevice">—</v></div>
          <div><k>服务器地址</k><v id="iServer">—</v></div>
          <div><k>心跳间隔</k><v id="iHb">—</v></div>
          <div><k>版本</k><v id="iVer">—</v></div>
          <div><k>配置文件</k><v id="iCfg">—</v></div>
          <div><k>日志文件</k><v id="iLog">—</v></div>
        </div>
      </section>

      <section class="card">
        <h2>最近日志</h2>
        <div class="lines" id="recentLines"><div class="ph-line">暂无日志</div></div>
      </section>

      <div class="row">
        <button class="btn sm" id="btnOpenCfg">打开配置目录</button>
        <button class="btn sm" id="btnOpenLog">打开日志目录</button>
        <button class="btn sm ghost" id="btnQuit">退出控制台</button>
      </div>
    </section>

    <!-- ═══ 设置 ═══ -->
    <section class="page" id="p-set">
      <div class="ph">
        <h1>设置</h1>
        <p>连接参数与指令权限 · 保存后需重启进程生效</p>
      </div>

      <section class="card">
        <h2>连接</h2>
        <div class="field">
          <label>服务器地址<small>B 端插件的 WebSocket 地址</small></label>
          <input type="text" id="f-server_url" placeholder="ws://127.0.0.1:8765/ws">
        </div>
        <div class="field">
          <label>认证 Token<small>须与插件配置一致</small></label>
          <div class="pwd">
            <input type="password" id="f-auth_token" placeholder="change-me">
            <button id="togglePwd">显示</button>
          </div>
        </div>
        <div class="field">
          <label>设备 ID<small>多设备时用于区分</small></label>
          <input type="text" id="f-device_id" placeholder="home-pc">
        </div>
        <div class="field">
          <label>心跳间隔<small>秒</small></label>
          <div class="inline">
            <input type="number" id="f-heartbeat_interval" style="width:92px" min="5">
            <span class="hint">超过插件端心跳超时（默认 60 秒）会被判定掉线</span>
          </div>
        </div>
        <div class="field">
          <label>断线重连上限<small>秒 · 指数退避</small></label>
          <div class="inline">
            <input type="number" id="f-max_reconnect_delay" style="width:92px" min="5">
            <span class="hint">断线后重试间隔的上限</span>
          </div>
        </div>
        <div class="field">
          <label>指令超时<small>秒</small></label>
          <div class="inline">
            <input type="number" id="f-default_timeout" style="width:92px" min="1">
            <span class="hint">单条指令等待结果的最长时间</span>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>启动</h2>
        <div class="field">
          <label>开机自启<small>登录后自动后台运行</small></label>
          <div class="sw" id="f-autostart"></div>
        </div>
        <div class="field">
          <label>构建应用索引<small>供 remote_app 搜索应用</small></label>
          <div class="sw" id="f-build_exe_index"></div>
        </div>
        <div class="field">
          <label>急停开关<small>开启后拒绝执行一切指令</small></label>
          <div class="sw danger" id="f-emergency_stop"></div>
        </div>
      </section>

      <section class="card">
        <h2>指令权限</h2>
        <div class="perms" id="perms"></div>
      </section>

      <div class="row">
        <button class="btn primary" id="btnSave">保存设置</button>
        <button class="btn" id="btnReload">重新加载</button>
      </div>
    </section>

    <!-- ═══ 日志 ═══ -->
    <section class="page" id="p-log">
      <div class="ph">
        <h1>运行日志</h1>
        <p id="logPath">—</p>
      </div>
      <div class="logbar">
        <span class="hint" id="logCount">—</span>
        <div class="sp"></div>
        <button class="tgl on" id="btnAutoScroll">自动滚动</button>
        <button class="btn sm" id="btnLogRefresh">刷新</button>
        <button class="btn sm" id="btnLogDir">打开目录</button>
      </div>
      <div class="log" id="logbox"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const ALL_ACTIONS = ["exec","sys","ping","file","file_pull","app","screenshot","system","input","keys","mouse","clipboard"];
const NUM_FIELDS = ["heartbeat_interval","max_reconnect_delay","default_timeout"];
const TXT_FIELDS = ["server_url","auth_token","device_id"];
let BUSY = false, PAGE = "ov", DEMO = false, BOOTED = false;

/* ── 后端桥：优先 pywebview 原生桥，否则走本地 HTTP 接口 ── */
async function call(method, ...args){
  if (DEMO) return demoCall(method, ...args);
  if (window.pywebview && window.pywebview.api && window.pywebview.api[method]){
    try { return await window.pywebview.api[method](...args); }
    catch (e) { return { ok:false, message:"调用失败：" + e }; }
  }
  try {
    const r = await fetch("/api/" + method, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(args)
    });
    return await r.json();
  } catch (e) {
    return { ok:false, message:"无法连接本地服务：" + e };
  }
}

/* 心跳：界面关掉后本地服务会自动退出 */
function heartbeat(){
  if (DEMO || (window.pywebview && window.pywebview.api)) return;
  fetch("/api/ping", { cache: "no-store" }).catch(() => {});
}

/* 浏览器直开 HTML 时的演示数据（打包运行不会走到这里） */
const demoState = {running:true, pid:7520, uptime:11520, connected:true, device_id:"home-pc",
  server_url:"ws://127.0.0.1:8765/ws", heartbeat_interval:15, version:"1.7.5", autostart:true,
  allowed_actions:ALL_ACTIONS.slice(), emergency_stop:false,
  config_file:"E:\\winremote-app\\config.yaml",
  log_file:"E:\\winremote-app\\logs\\winremote-app.log", last_error:"",
  recent_lines:[
    "2026-10-17 12:28:05 [INFO] winremote-app.desktop: 界面服务已启动",
    "2026-10-17 12:28:05 [INFO] winremote-app.ws: 已连接 B 端服务端，device_id=home-pc",
    "2026-10-17 12:30:11 [INFO] winremote-app.ws: 收到指令 method=file",
    "2026-10-17 12:30:12 [WARNING] winremote-app.gui: 目标窗口不在前台，已激活「记事本」",
    "2026-10-17 12:31:03 [INFO] winremote-app.executor: 执行 screenshot（复用缓存）"
  ]};
function demoCall(method){
  if (method === "get_state") return Object.assign({ok:true}, demoState);
  if (method === "get_config") return Object.assign({ok:true}, demoState);
  if (method === "read_log") return {ok:true, path:demoState.log_file, lines:demoState.recent_lines};
  return {ok:true, message:"演示模式"};
}

/* ── 提示 ── */
let toastTimer = null;
function toast(msg, kind){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (kind === "bad" ? " bad" : kind === "good" ? " good" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 2600);
}

/* ── 导航 ── */
document.querySelectorAll("#nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#nav button").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".page").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    PAGE = b.dataset.p;
    document.getElementById("p-" + PAGE).classList.add("on");
    if (PAGE === "log") refreshLog();
    if (PAGE === "set") loadSettings();
  };
});

function cls(line){
  if (line.indexOf("[ERROR]") >= 0) return "e";
  if (line.indexOf("[WARNING]") >= 0) return "w";
  if (line.indexOf("[INFO]") >= 0) return "i";
  return "";
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtUptime(sec){
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
  if (d) return d + " 天 " + h + " 小时";
  if (h) return h + " 小时 " + m + " 分";
  if (m) return m + " 分";
  return "不到 1 分";
}

/* ── 状态渲染 ── */
function renderState(st){
  const running = !!st.running;
  $("#stateTitle").textContent = running ? "运行中" : "已停止";
  $("#stateSub").textContent = running
    ? "PID " + st.pid + " · 已运行 " + fmtUptime(st.uptime)
    : "后台执行器未运行，点击「开启进程」启动";
  $("#pulse").className = "pulse" + (running ? " ok" : "");

  let kind = "", text = "进程未运行";
  if (running && st.connected === true){ kind = "ok"; text = "B 端已连接"; }
  else if (running && st.connected === false){ kind = "bad"; text = "未连接，重连中"; }
  else if (running){ text = "连接状态未知"; }
  $("#connPill").className = "pill" + (kind ? " " + kind : "");
  $("#conntext").textContent = text;

  const footOk = running && st.connected !== false;
  $("#footdot").className = "dot" + (footOk ? " ok" : (st.connected === false ? " bad" : ""));
  $("#footdev").textContent = (st.device_id || "未配置") + (running ? "" : " · 已停止");

  $("#iDevice").textContent = st.device_id || "—";
  $("#iServer").textContent = st.server_url || "—";
  $("#iHb").textContent = (st.heartbeat_interval == null ? "—" : st.heartbeat_interval) + " 秒";
  $("#iVer").textContent = "v" + (st.version || "—");
  $("#iCfg").textContent = st.config_file || "—";
  $("#iLog").textContent = st.log_file || "—";

  const err = $("#errline");
  if (st.last_error){
    const datePart = String(st.last_error).slice(0, 19);
    let stale = false;
    try {
      const t0 = Date.parse(datePart.replace(" ", "T"));
      if (!isNaN(t0)) stale = (Date.now() - t0) > 3600000;
    } catch (e) {}
        err.className = "errline" + (stale ? " stale" : "");
    err.style.display = "block";
    err.textContent = (stale ? "历史错误 · " : "最近错误 · ") + st.last_error;
  } else {
    err.style.display = "none";
  }

  if (st.recent_lines && st.recent_lines.length){
    $("#recentLines").innerHTML = st.recent_lines.map(l =>
      '<div class="' + cls(l) + '">' + esc(l) + '</div>').join("");
  }

  if (!BUSY){
    $("#btnStart").disabled = running;
    $("#btnRestart").disabled = !running;
    $("#btnStop").disabled = !running;
  }
}

async function tick(){
  const st = await call("get_state");
  if (st && st.ok){
    if ($("#ver").textContent.indexOf("v") < 0 && st.version)
      $("#ver").textContent = "C 端执行器 v" + st.version;
    renderState(st);
  }
}

/* ── 进程操作（危险操作需二次确认） ── */
function armConfirm(btn){
  if (btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1";
  const original = btn.textContent;
  btn.classList.add("confirm");
  btn.textContent = "再点一次确认";
  setTimeout(() => {
    btn.dataset.armed = "";
    btn.classList.remove("confirm");
    btn.textContent = original;
  }, 3200);
  return false;
}

async function act(fn, label){
  if (BUSY) return;
  BUSY = true;
  ["btnStart","btnRestart","btnStop"].forEach(id => { $("#" + id).disabled = true; });
  const r = await call(fn);
  BUSY = false;
  toast((r && r.message) || (label + "完成"), r && r.ok ? "good" : "bad");
  await new Promise(res => setTimeout(res, 700));
  tick();
}
$("#btnStart").onclick = () => act("start", "启动");
$("#btnRestart").onclick = () => {
  if (armConfirm($("#btnRestart"))) act("restart", "重启");
};
$("#btnStop").onclick = () => {
  if (armConfirm($("#btnStop"))) act("stop", "关闭");
};

$("#btnOpenCfg").onclick = async () => {
  const r = await call("open_folder", "config");
  toast(r.message || "已打开", r.ok ? null : "bad");
};
$("#btnOpenLog").onclick = async () => {
  const r = await call("open_folder", "log");
  toast(r.message || "已打开", r.ok ? null : "bad");
};
$("#btnQuit").onclick = async () => {
  await call("quit_app");
  setTimeout(() => { try { window.close(); } catch (e) {} }, 250);
};

/* ── 设置页 ── */
const perms = new Set();
$("#perms").innerHTML = ALL_ACTIONS.map(a =>
  '<div class="perm" data-a="' + a + '"><span class="tick"></span>' + a + '</div>').join("");
document.querySelectorAll(".perm").forEach(el => {
  el.onclick = () => {
    const a = el.dataset.a;
    if (perms.has(a)) perms.delete(a); else perms.add(a);
    el.classList.toggle("on", perms.has(a));
  };
});

function swVal(id){ return $("#" + id).classList.contains("on"); }
function setSw(id, v){ $("#" + id).classList.toggle("on", !!v); }

["f-build_exe_index","f-emergency_stop"].forEach(id => {
  $("#" + id).onclick = () => setSw(id, !swVal(id));
});
$("#f-autostart").onclick = async () => {
  const next = !swVal("f-autostart");
  setSw("f-autostart", next);
  const r = await call("set_autostart", next);
  toast(r.message || "", r.ok ? "good" : "bad");
  if (!r.ok) setSw("f-autostart", !next);
};
$("#togglePwd").onclick = () => {
  const inp = $("#f-auth_token");
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  $("#togglePwd").textContent = show ? "隐藏" : "显示";
};

async function loadSettings(){
  const cfg = await call("get_config");
  if (!cfg || !cfg.ok) return;
  TXT_FIELDS.forEach(k => { $("#f-" + k).value = cfg[k] == null ? "" : cfg[k]; });
  NUM_FIELDS.forEach(k => { $("#f-" + k).value = cfg[k] == null ? "" : cfg[k]; });
  setSw("f-build_exe_index", cfg.build_exe_index !== false);
  setSw("f-emergency_stop", !!cfg.emergency_stop);
  const st = await call("get_state");
  if (st && st.ok && typeof st.autostart === "boolean") setSw("f-autostart", st.autostart);
  if (st && st.ok && st.log_file) $("#logPath").textContent = st.log_file;

  perms.clear();
  (cfg.allowed_actions || []).forEach(a => perms.add(a));
  document.querySelectorAll(".perm").forEach(el => el.classList.toggle("on", perms.has(el.dataset.a)));
}

$("#btnSave").onclick = async () => {
  const patch = {
    build_exe_index: swVal("f-build_exe_index"),
    emergency_stop: swVal("f-emergency_stop"),
    allowed_actions: ALL_ACTIONS.filter(a => perms.has(a))
  };
  TXT_FIELDS.forEach(k => { patch[k] = $("#f-" + k).value.trim(); });
  NUM_FIELDS.forEach(k => {
    const v = Number($("#f-" + k).value);
    if (!isNaN(v) && v > 0) patch[k] = v;
  });
  if (!patch.allowed_actions.length){
    toast("至少要保留一项指令权限", "bad");
    return;
  }
  const r = await call("save_settings", patch);
  toast(r.message || "已保存", r.ok ? "good" : "bad");
};
$("#btnReload").onclick = async () => { await loadSettings(); toast("已重新加载"); };

/* ── 日志页 ── */
let autoScroll = true;
$("#btnAutoScroll").onclick = () => {
  autoScroll = !autoScroll;
  $("#btnAutoScroll").classList.toggle("on", autoScroll);
  if (autoScroll) { const b = $("#logbox"); b.scrollTop = b.scrollHeight; }
};
$("#btnLogRefresh").onclick = () => { refreshLog(); toast("已刷新"); };
$("#btnLogDir").onclick = async () => {
  const r = await call("open_folder", "log");
  toast(r.message || "已打开", r.ok ? null : "bad");
};

async function refreshLog(){
  const r = await call("read_log", 300);
  if (!r || !r.ok) return;
  if (r.path) $("#logPath").textContent = r.path;
  const lines = r.lines || [];
  const box = $("#logbox");
  const nearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  box.innerHTML = lines.length
    ? lines.map(l => '<div class="' + cls(l) + '">' + esc(l) + '</div>').join("")
    : '<div class="ph-line">暂无日志内容</div>';
  $("#logCount").textContent = lines.length ? ("共 " + lines.length + " 行") : "暂无日志";
  if (autoScroll && nearBottom) box.scrollTop = box.scrollHeight;
}

/* ── 启动 ── */
async function boot(){
  if (BOOTED) return;
  BOOTED = true;
  if (!(window.pywebview && window.pywebview.api) && location.protocol === "file:") DEMO = true;
  await tick();
  await loadSettings();
  setInterval(() => { tick(); if (PAGE === "log") refreshLog(); }, 1500);
  setInterval(heartbeat, 2000);
}
if (location.protocol === "file:") boot();
else if (window.pywebview && window.pywebview.api) boot();
else {
  window.addEventListener("pywebviewready", boot, { once: true });
  setTimeout(boot, 500);
}
</script>
</body>
</html>
